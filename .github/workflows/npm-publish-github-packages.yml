name: Publish gaming-infos to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  github-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com/
          scope: '@nekosuneprojectsnpm'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || { echo "::error::Release tag and package version disagree"; exit 1; }
      - run: npm ci
      - run: npm run check && npm test
      - name: Adjust scope only for GitHub Packages
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          if (!p.name.startsWith('@nekosuneprojects/')) throw Error('Unexpected npmjs package name');
          p.name = p.name.replace('@nekosuneprojects/','@nekosuneprojectsnpm/');
          p.publishConfig = { ...p.publishConfig, registry: 'https://npm.pkg.github.com/' };
          fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          NODE
      - name: Publish GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --ignore-scripts --registry=https://npm.pkg.github.com/
